<script>
const W=1920,H=1080,cv=document.getElementById('c'),G0=cv.getContext('2d');let g=G0;
const C={bg:'#0c0f13',line:'#8e9aa8',dim:'#3b4450',faint:'rgba(150,165,180,.22)',amber:'#f0b24b',blue:'#6fb7c9',white:'#eef1f4',mute:'#8b96a3'};
const FONT='"Inter Display","Inter",sans-serif';
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const E3=x=>1-Math.pow(1-cl(x),3), EIO=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const P=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,t)=>a+(b-a)*t;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let r=Math.imul(s^s>>>15,1|s);r=r+Math.imul(r^r>>>7,61|r)^r;return((r^r>>>14)>>>0)/4294967296}}

// ---------- primitives ----------
function ln(x0,y0,x1,y1,p=1,col=C.line,w=2,a=1,glow=0,dash=null){
  if(p<=0)return; g.save();g.globalAlpha=a;g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';
  if(glow){g.shadowColor=col;g.shadowBlur=glow}
  if(dash)g.setLineDash(dash);
  g.beginPath();g.moveTo(x0,y0);g.lineTo(lerp(x0,x1,p),lerp(y0,y1,p));g.stroke();g.restore();
}
function dot(x,y,r,col=C.line,a=1,glow=0){ if(a<=0||r<=0)return;g.save();g.globalAlpha=a;g.fillStyle=col;if(glow){g.shadowColor=col;g.shadowBlur=glow}g.beginPath();g.arc(x,y,r,0,7);g.fill();g.restore()}
function ring(x,y,r,col=C.line,w=2,a=1,glow=0){ if(a<=0||r<=0)return;g.save();g.globalAlpha=a;g.strokeStyle=col;g.lineWidth=w;if(glow){g.shadowColor=col;g.shadowBlur=glow}g.beginPath();g.arc(x,y,r,0,7);g.stroke();g.restore()}
function txt(s,x,y,o={}){ const {size=30,col=C.white,a=1,align='center',weight=600,ls=0,base='middle'}=o; if(a<=0)return;
  g.save();g.globalAlpha=a;g.fillStyle=col;g.font=`${weight} ${size}px ${FONT}`;g.textAlign=align;g.textBaseline=base;g.letterSpacing=ls+'px';g.fillText(s,x,y);g.restore()}
function rrect(x,y,w,h,r,fill,stroke,sw=2,a=1,glow=0){ g.save();g.globalAlpha=a;if(glow){g.shadowColor=stroke||fill;g.shadowBlur=glow}
  g.beginPath();g.roundRect(x,y,w,h,r);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=sw;g.stroke()}g.restore()}
function arrowHead(x,y,ang,s=12,col=C.line,a=1){ g.save();g.globalAlpha=a;g.fillStyle=col;g.translate(x,y);g.rotate(ang);g.beginPath();g.moveTo(0,0);g.lineTo(-s,-s*.55);g.lineTo(-s,s*.55);g.closePath();g.fill();g.restore()}
function pill(s,x,y,col,a=1,size=24){ g.save();g.font=`600 ${size}px ${FONT}`;g.letterSpacing='3px';const w=g.measureText(s).width+44;g.restore();
  rrect(x-w/2,y-size*.95,w,size*1.9,size,'rgba(12,15,19,.7)',col,2,a);txt(s,x,y+1,{size,col,a,ls:3}) }

// ---------- network (map) ----------
const N0=[[190,860],[430,700],[330,330],[640,190],[760,880],[980,790],[1130,250],[1330,820],[1520,330],[1650,640],[1790,900],[1000,120],[1500,960],[250,1010],[860,980],[1750,200],[120,520],[1840,470]];
const NN=N0.map(([x,y])=>[x,150+y*0.62]);
const ROUTE=[[0,1],[1,5],[5,7],[7,9],[9,8]];
const WEB=[[1,2],[2,3],[3,11],[11,6],[6,8],[1,4],[4,5],[5,14],[14,13],[0,13],[7,12],[12,10],[9,10],[8,15],[9,17],[1,16],[16,2],[6,5],[15,17],[3,6]];
function drawNet(pw,pr,alpha=1){
  const nw=WEB.length, nr=ROUTE.length, shown=new Array(NN.length).fill(0);
  WEB.forEach((e,k)=>{const p=E3(cl(pw*(nw+2)-k,0,1)); if(p>0){ln(...NN[e[0]],...NN[e[1]],p,C.line,2,.3*alpha); shown[e[0]]=Math.max(shown[e[0]],p); shown[e[1]]=Math.max(shown[e[1]],p*cl(p*2))}});
  ROUTE.forEach((e,k)=>{const p=E3(cl(pr*(nr)-k,0,1)); if(p>0){ln(...NN[e[0]],...NN[e[1]],p,C.amber,5,alpha,22); shown[e[0]]=1; shown[e[1]]=Math.max(shown[e[1]],p)}});
  NN.forEach((n,i)=>{ if(shown[i]<=0)return; const onR=ROUTE.some(e=>e.includes(i)&&pr>0); dot(n[0],n[1],(onR?9:6)*shown[i],onR?C.amber:'#bcc7d3',(onR?1:.7)*alpha,onR?26:0)});
}
function destRing(p,t){ if(p<=0)return;const n=NN[8];ring(n[0],n[1],26*p,C.amber,3,p);const ph=(t*.9)%1;ring(n[0],n[1],26+ph*44,C.amber,2,(1-ph)*.5*p)}

// ---------- fog ----------
const R0=rng(7);const blobs=Array.from({length:7},()=>({x:R0()*W,y:R0()*H,r:420+R0()*420,ph:R0()*6.28,sp:.15+R0()*.2,a:.5+R0()*.5}));
function fog(t,d,k=1){ if(d<=0)return; g.save();g.globalCompositeOperation='screen';
  blobs.forEach(b=>{const x=b.x+Math.sin(t*b.sp+b.ph)*140,y=b.y+Math.cos(t*b.sp*.8+b.ph)*80;const gr=g.createRadialGradient(x,y,0,x,y,b.r);
    gr.addColorStop(0,`rgba(176,190,205,${.2*b.a*d*k})`);gr.addColorStop(1,'rgba(176,190,205,0)');g.fillStyle=gr;g.fillRect(x-b.r,y-b.r,b.r*2,b.r*2)});g.restore()}
const noise=document.createElement('canvas');noise.width=noise.height=256;
(()=>{const n=noise.getContext('2d'),d=n.createImageData(256,256),r=rng(3);for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}n.putImageData(d,0,0)})();
const gridc=document.createElement('canvas');gridc.width=gridc.height=60;
(()=>{const q=gridc.getContext('2d');q.fillStyle='rgba(160,175,190,.5)';q.beginPath();q.arc(30,30,1.4,0,7);q.fill()})();

// ---------- scene state helpers ----------
function bgLayer(t,u,sid){
  g.fillStyle=C.bg;g.fillRect(0,0,W,H);
  const bg=g.createRadialGradient(W/2,H*.45,100,W/2,H/2,1300);bg.addColorStop(0,'#141a22');bg.addColorStop(1,'#080a0d');g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.save();g.globalAlpha=.16;g.fillStyle=g.createPattern(gridc,'repeat');g.fillRect(0,0,W,H);g.restore();
}
function post(t){
  const v=g.createRadialGradient(W/2,H/2,420,W/2,H/2,1150);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.5)');g.fillStyle=v;g.fillRect(0,0,W,H);
  g.save();g.globalAlpha=.045;g.globalCompositeOperation='overlay';const f=Math.floor(t*30),ox=(f*37)%256,oy=(f*91)%256;
  for(let x=-256+ox;x<W;x+=256)for(let y=-256+oy;y<H;y+=256)g.drawImage(noise,x,y);g.restore();
}



window.SCRIPT={"s0": "Two people walk into a distribution center. An engineer, and a strategist. On the table, four reasonable requests. Add pickers. Retrain the slow operators. Enforce the process. Measure before and after. Each one is what a good specialist would do. In this case, each one would have been a mistake. This is how they found out.", "s1": "The case is synthetic, generated with fdekit, but every number is real and reproducible. Eight hundred orders. Only fifty-four percent follow the declared flow. The other paths are not chaos. Every detour is a repair.", "s2": "Requests one and two: we are slow, so add pickers, and retrain the slow ones. The engineer lines up all seven pickers. Their medians sit within six percent of each other. Picking takes about seventy seconds. But the order waits almost an hour before anyone touches it, and sixty-one percent of all the waiting happens in that one queue. Statistics says it is not the people. The floor says it is the wait. Together: no retraining, and no extra pickers all day. Capacity goes where the queue forms.", "s3": "Request three: enforce the flow. But look at the detours. A pick at the wrong location. A carton repacked. A shelf refilled. You ask the floor about the last time it went wrong, and the data agrees. Orders that touch a product with a wrong dimension are reworked two point three times as often. One product in four has bad master data. Fixing it removes about fourteen percent of the rework. Not all of it. Enforcing the flow would have punished the people doing the repairs.", "s4": "Then something nobody asked for. A hundred and fifty-seven meters walked per order. Two thirds of all visits go to the fast movers, and barely one in seven of those lands near the dock, at waist height. Move them, and the model estimates thirty percent less distance per visit. That one gets built, as a pilot.", "s5": "Request four: measure before and after. After the pilot, cycle time in the pilot zone went up forty-two percent. Kill it? Zone B, untouched, went up fifty-one percent in the same weeks. Something hit both zones at once. Against its control, the pilot saved about five minutes per order. Without a control group, you kill the one change that worked. And three days of baseline is still too few to fully trust it.", "s6": "And the part no number decides. The operators hear automation, and they feel replacement. So the standard work is written with them, and signed by them. The chart goes to the shift supervisor's weekly review, not to a dashboard nobody opens. The limits are frozen, so if the gain fades, the chart says so before the client does.", "s7": "As asked: hire all day, retrain seven people, enforce one flow, and kill the pilot. As shipped: capacity at the peak, the master data fixed, the fast movers moved, a pilot that survived, and a chart with an owner. The engineer built every piece of it. The strategist decided which pieces, and owned the cost of being wrong. That is the polymath at work: every branch of knowledge changed a decision. Where the rules are clear, let the machine win. Where there are none, someone has to decide. And when you leave, the map stays."};
const IMG={};['spaghetti'].forEach(n=>{const i=new Image();i.src='assets/'+n+'.png';IMG[n]=i});
function card(x,y,w,h,a=1){g.save();g.globalAlpha=a;g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=30;g.fillStyle='#fff';g.beginPath();g.roundRect(x,y,w,h,14);g.fill();g.restore()}
function photo(im,x,y,w,a=1,reveal=1){ if(!im.complete||a<=0)return 0; const h=w*im.naturalHeight/im.naturalWidth; card(x,y,w,h,a);
  g.save();g.globalAlpha=a;g.beginPath();g.roundRect(x,y,w*reveal,h,14);g.clip();g.drawImage(im,x,y,w,h);g.restore(); return h}
const RED='#e0715a';
let S=null;
function A(ph,off=0){const tx=SCRIPT[S.id],i=tx.indexOf(ph);if(i<0)throw new Error('phrase '+ph);return S.head+S.vd*(i/tx.length)+off}
function sc(id){return TL.scenes.find(s=>s.id===id)}
function absAt(id,ph){const s=sc(id),tx=SCRIPT[id],i=tx.indexOf(ph);return s.voice_at+s.voice_dur*(i/tx.length)}
function stamp(s,x,y,col,a,rot=-.06,size=30){if(a<=0)return;g.save();g.globalAlpha=a;g.translate(x,y);g.rotate(rot);const sc=1+(1-a)*.4;g.scale(sc,sc);g.font=`700 ${size}px ${FONT}`;g.letterSpacing='5px';const w=g.measureText(s).width+48;
  g.strokeStyle=col;g.lineWidth=4;g.shadowColor=col;g.shadowBlur=14;g.strokeRect(-w/2,-size*.95,w,size*1.9);g.fillStyle=col;g.textAlign='center';g.textBaseline='middle';g.fillText(s,0,2);g.restore()}
function check(x,y,a,col=C.amber,s=1){if(a<=0)return;g.save();g.globalAlpha=a;g.strokeStyle=col;g.lineWidth=5*s;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(x+12*s,y+12*s);g.lineTo(x+34*s,y-12*s);g.stroke();g.restore()}
function strike(x0,x1,y,p,col=RED){ln(x0,y,x1,y,p,col,4,.9)}
function duo(x,y,a=1,lab=0){dot(x,y,13,C.amber,a,20);dot(x-34,y+4,11,C.blue,a,16);if(lab>0){txt('strategist',x+22,y-24,{size:20,col:C.amber,a:a*lab,align:'left',weight:500});txt('engineer',x-46,y+34,{size:20,col:C.blue,a:a*lab,align:'right',weight:500})}}

const KICK={s0:['THE SCENE','Four reasonable requests'],s1:['THE CASE','Synthetic distribution center'],s2:['REQUESTS 1 + 2','“Add pickers. Retrain the slow ones.”'],s3:['REQUEST 3','“Enforce the flow.”'],s4:['NOBODY ASKED','The walk'],s5:['REQUEST 4','“Measure before and after.”'],s6:['THE PART NO NUMBER DECIDES','The people who run it'],s7:['THE LEDGER','']};
const WHY={s2:[['STATISTICS','QUEUEING','THE FLOOR'],'','Together'],s3:[['ANTHROPOLOGY','DATA QUALITY'],'Ask about the last time — The Mom Test (Fitzpatrick)','Orders that touch'],s4:[['WALKING IT','LAYOUT'],'','Move them'],s5:[['EXPERIMENTAL DESIGN'],'Measure what changes the decision — How to Measure Anything (Hubbard)','Against its control'],s6:[['PSYCHOLOGY','POLITICS'],'Name the resistance — Flawless Consulting (Block)','So the standard work']};

// ---------- s0: llegan dos personas; cuatro peticiones ----------
function floorPlan(a,dim=0){rrect(220,200,1480,620,22,'rgba(20,26,34,.55)',C.line,2.5,a*.8);
  for(let r=0;r<5;r++)for(let k=0;k<7;k++)rrect(300+k*190,250+r*105,160,46,6,'rgba(150,165,180,'+(.12-dim*.06)+')','rgba(150,165,180,'+(.45-dim*.25)+')',1.4,a);
  rrect(220,760,150,60,8,'rgba(240,178,75,.1)',C.amber,2,a*.8);txt('DOCK',295,790,{size:18,col:C.amber,ls:6,a:a*.9})}
const TICK=[['Add pickers','we are slow'],['Retrain the slow operators',''],['Enforce the process','31 paths is chaos'],['Measure before and after','quick check'],];
SC={};
SC.s0=(t)=>{
  const a=E3(P(t,-.4,.6)),dim=E3(P(t,A('On the table'),A('On the table',.6)));floorPlan(a,dim);
  const w=EIO(P(t,A('Two people'),A('On the table')));const path=[[300,790],[300,700],[860,700],[860,580]];
  let L=0,seg=[];for(let i=1;i<path.length;i++){const l=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]);seg.push(l);L+=l}
  let d=w*L,p=path[0];for(let i=1;i<path.length;i++){if(d<=seg[i-1]){const f=d/seg[i-1];p=[lerp(path[i-1][0],path[i][0],f),lerp(path[i-1][1],path[i][1],f)];break}d-=seg[i-1];p=path[i]}
  duo(p[0],p[1],a,E3(P(t,A('An engineer'),A('and a strategist',.6))));
  TICK.forEach(([s,n],i)=>{const t0=A(['Add pickers','Retrain','Enforce','Measure'][i]);const pa=E3(P(t,t0-.1,t0+.4));if(pa<=0)return;
    const x=1060+(i%2)*330,y=300+Math.floor(i/2)*190,r=[-.04,.03,.025,-.03][i];
    g.save();g.globalAlpha=pa;g.translate(x,y-(1-pa)*30);g.rotate(r);g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=24;g.fillStyle='#efe3c2';g.fillRect(-150,-62,300,124);g.shadowBlur=0;
    g.fillStyle='#d64b3a';g.beginPath();g.arc(0,-50,7,0,7);g.fill();g.fillStyle='#1d2229';g.font=`700 26px ${FONT}`;g.textAlign='center';g.textBaseline='middle';
    const wds=s.split(' ');if(s.length>16){const m=Math.ceil(wds.length/2);g.fillText(wds.slice(0,m).join(' '),0,-6);g.fillText(wds.slice(m).join(' '),0,26)}else g.fillText(s,0,8);g.restore();
    stamp('REASONABLE',x,y+96,C.blue,E3(P(t,A('Each one is what')+i*.18,A('Each one is what')+i*.18+.35))*(1-E3(P(t,A('would have been a mistake'),A('would have been a mistake',.4)))),r,16);
    stamp('MISTAKE?',x,y+96,C.amber,E3(P(t,A('would have been a mistake')+i*.15,A('would have been a mistake')+i*.15+.35)),r,16)});
  txt('This is how they found out.',960,880-60,{size:34,col:C.white,a:0});
};
// ---------- s1: el caso ----------
SC.s1=(t)=>{
  const nodes=['ORDER_RELEASED','PICK','CONSOLIDATE','PACK','QC','SHIP'], xs=nodes.map((_,i)=>260+i*280), y=470;
  const ex={CARTON_REWORK:[xs[3]+140,300],PICK_EXCEPTION_LOCATION:[xs[1]-10,640],REPACK:[xs[4]+140,640],REPLENISH:[xs[2],260],SHORT_PICK:[xs[0]+150,300]};
  const base=E3(P(t,-.4,.5));
  nodes.forEach((n,i)=>{dot(xs[i],y,13*base,C.amber,1,16);txt(n,xs[i],y+(i%2?46:-46),{size:17,col:C.mute,ls:2,a:base})});
  for(let i=0;i<5;i++)ln(xs[i],y,xs[i+1],y,base,C.amber,7,1,22);
  const lp=E3(P(t,A('Eight hundred'),A('Only fifty-four')));const R=rng(19),keys=Object.keys(ex);
  const arcs=[[3,'CARTON_REWORK',3,170],[1,'PICK_EXCEPTION_LOCATION',1,42],[4,'REPACK',4,17],[1,'PICK_EXCEPTION_LOCATION',2,24],[2,'REPLENISH',3,9],[0,'SHORT_PICK',1,7]];
  for(let k=0;k<25;k++){arcs.push([Math.floor(R()*6),keys[Math.floor(R()*5)],Math.floor(R()*6),3+R()*5])}
  const rep=E3(P(t,A('Every detour'),A('Every detour',.8)));
  arcs.forEach((a,k)=>{const p=E3(cl(lp*1.3-k*.016,0,1));if(p<=0)return;const A0=[xs[a[0]],y],M0=ex[a[1]],M=[M0[0],y+(M0[1]-y)*2.0],B=[xs[a[2]],y];
    g.save();g.globalAlpha=(k<6?.9:.4)*p;g.strokeStyle=k<6?(rep>0?C.amber:C.blue):'#9fb0c2';g.lineWidth=k<6?Math.max(2,Math.sqrt(a[3])/1.6):1.3;g.beginPath();g.moveTo(...A0);g.quadraticCurveTo(M[0],M[1],...B);g.stroke();g.restore()});
  Object.entries(ex).forEach(([n,p],i)=>{const a=E3(P(t,A('Eight hundred')+i*.12,A('Eight hundred')+.5+i*.12));dot(p[0],p[1],8*a,rep>0?C.amber:C.blue,a,10);txt(n,p[0],p[1]+(p[1]>y?30:-28),{size:15,col:rep>0?C.amber:C.blue,ls:2,a:a*.9});
    if(rep>0)pill('REPAIR',p[0],p[1]+(p[1]>y?66:-62),C.amber,rep,15)});
  const b=E3(P(t,A('Only fifty-four'),A('Only fifty-four',.6)));txt('54.12%',1590,770,{size:84,col:C.white,a:b,ls:-3});txt('follow the declared flow',1590,826,{size:22,col:C.mute,a:b,weight:500});
  txt('SYNTHETIC CASE · data generated with fdekit · 800 orders · reproducible',380,800,{size:16,col:C.mute,ls:4,a:E3(P(t,A('The case'),A('The case',.8))),weight:500,align:'left'});
};
// ---------- s2: colisión estadística + cola ----------
const OPS=[['PICK-05',67.3],['PICK-06',67.5],['PICK-01',68.2],['PICK-02',69.0],['PICK-07',69.2],['PICK-04',70.5],['PICK-03',71.4]];
SC.s2=(t)=>{
  const x0=420,x1=1500,y0=300,dy=62;
  const rs=EIO(P(t,A('But the order waits'),A('But the order waits',1.4)));   // reescala: 0–100 s → 0–70 min
  const maxS=lerp(100,70*60,rs);const X=v=>x0+(x1-x0)*v/maxS;
  const ax=E3(P(t,-.4,.4)),fadeRows=1-.55*E3(P(t,A('Statistics says'),A('Statistics says',.6)));
  ln(x0,y0+7*dy-20,x1,y0+7*dy-20,ax,C.dim,2);
  const ticks=rs<.5?[0,20,40,60,80,100].map(v=>[v,v+' s']):[0,600,1200,1800,2400,3000,3600].map(v=>[v,(v/60)+' min']);
