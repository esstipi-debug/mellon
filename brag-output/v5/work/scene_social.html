window.SCRIPT={"s0": "Two people walk into a distribution center. An engineer, and a strategist. On the table, four reasonable requests. Add pickers. Retrain the slow operators. Enforce the process. Measure before and after. Each one is what a good specialist would do. In this case, each one would have been a mistake. This is how they found out.", "s1": "The case is synthetic, generated with fdekit. Every number on screen can be reproduced. Eight hundred orders. Only fifty-four percent follow the declared flow. The other paths are not chaos. Every detour is a repair.", "s2": "Requests one and two: we are slow, so add pickers, and retrain the slow ones. The engineer lines up all seven pickers. Their medians sit within six percent of each other. Picking takes about seventy seconds. But the order waits almost an hour before anyone touches it, and sixty-one percent of all the waiting happens in that one queue. So the strategist asks a different question: when do the orders arrive? Between nine and ten thirty, three hundred and thirteen of the day's eight hundred orders are released in one ninety-minute peak. Statistics says it is not the people. The floor says it is the wave. Together: no retraining, and no extra pickers all day. Level the release against the capacity you already have.", "s3": "Request three: enforce the flow. But look at the detours. A pick at the wrong location. A carton repacked. A shelf refilled. You ask the packer about the last time it went wrong. “The system always sends me the small box for these.” The data agrees. Orders that touch a product with a wrong dimension are reworked two point three times as often. One product in four has bad master data. Fixing only the dimension errors, about one product in five, removes about fourteen percent of the carton rework. Not all of it. Enforcing the flow would have punished the people doing the repairs.", "s4": "Then something nobody asked for. A hundred and fifty-seven meters walked per order. Two thirds of all visits go to the fast movers, and barely one in seven of those lands in the golden zone: next to the dock, at waist height. Move them, and the model estimates thirty percent less distance per visit. But a picker already told you why that is dangerous. “When it's not there, I remember where it usually is. The system doesn't.” The last re-slotting moved products and never updated their locations. So the move ships with the master data update, or not at all.", "s5": "Request four: judge it by before and after. After the pilot, median cycle time in the pilot zone went up fifty-six percent. Kill it? Zone B, untouched, went up sixty-four percent in the same weeks. Something hit both zones at once. Against its control, the pilot looks like it saved about five minutes per order. Without a control group, you kill the one change that worked. And three days of baseline is too few to fully trust it, so the pilot stays, and the baseline grows.", "s6": "And the part no number decides. In a case like this, people hear automation and feel replacement. So you name it, out loud, and the standard work is written with them. They sign it at handover. Then someone has to own the chart. Left in a dashboard nobody opens, a fading gain goes unnoticed. In the shift supervisor's weekly review, with frozen limits, the chart says so before the client does.", "s7": "As asked: hire all day, retrain the slow ones, enforce one flow, judge by before and after. As decided: staff the peak or level the release, fix the master data, move the fast movers with their locations updated, keep the pilot and grow its baseline, and put the chart in front of a shift supervisor every week. The engineer built the analysis and the tools. The client owns the changes. The strategist decided which ones, and owned the cost of being wrong. That is the polymath at work: every branch of knowledge changed a decision. Where the rules are clear, let the machine win. Where there are none, someone has to decide. And when you leave, the map stays."};
