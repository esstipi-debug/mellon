<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">

<style>
/* Narvi Decision Cockpit. Sistema: docs/designs/DESIGN.md (capas Surface / Panel / Well,
   bordes de 1px, luz superior, numeros tabulares, color solo para estado).
   Sin fuentes externas: la pagina no llama a ningun otro servidor. */
:root {
  color-scheme: dark;
  --surface-base: #08090d;
  --surface-panel: #11141c;
  --surface-well: #0c0e14;
  --surface-raised: #171b26;
  --border-hairline: rgba(255, 255, 255, 0.08);
  --border-highlight: rgba(255, 255, 255, 0.16);
  --inner-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  /* DESIGN.md pide #64748b; sobre el panel mide 3,9:1. Este mide 5,3:1. */
  --text-muted: #7c8ba1;
  --text-faint: #334155;
  --ok-fg: #34d399;
  --ok-bg: rgba(16, 185, 129, 0.08);
  --ok-border: rgba(16, 185, 129, 0.25);
  --note-fg: #fbbf24;
  --note-bg: rgba(245, 158, 11, 0.08);
  --note-border: rgba(245, 158, 11, 0.25);
  --alert-fg: #f87171;
  --alert-bg: rgba(239, 68, 68, 0.08);
  --alert-border: rgba(239, 68, 68, 0.25);
  --accent: #4f46e5;
  --accent-hover: #4338ca;
  --accent-fg: #a5b4fc;
  --accent-bg: rgba(99, 102, 241, 0.1);
  --accent-border: rgba(99, 102, 241, 0.35);
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-full: 9999px;
  --font-sans: "Inter", "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, ui-monospace, Menlo, monospace;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --z-sticky: 10;
  --z-toast: 20;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--surface-base); }
body {
  min-height: 100vh;
  background: var(--surface-base);
  color: var(--text-primary);
  font: 14px/1.5 var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-fg); outline-offset: 2px; }
[hidden] { display: none !important; }

.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.num { text-align: right; white-space: nowrap; }
.micro {
  font: 600 11px/1.3 var(--font-mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.muted { color: var(--text-muted); }
.soft { color: var(--text-secondary); }

/* ---- cabecera ---- */
.top {
  position: sticky; top: 0; z-index: var(--z-sticky);
  background: var(--surface-base);
  border-bottom: 1px solid var(--border-hairline);
}
.top-inner {
  max-width: 1360px; margin: 0 auto; padding: 10px 24px;
  display: flex; align-items: center; gap: 16px 24px; flex-wrap: wrap;
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; font-size: 14px; font-weight: 400; line-height: 1.2; }
.brand-mark { font: 700 15px/1 var(--font-mono); letter-spacing: 0.14em; }
.brand-sub { color: var(--text-secondary); font-size: 13px; }
.steps { display: flex; gap: 2px; list-style: none; padding: 3px; background: var(--surface-well);
  border: 1px solid var(--border-hairline); border-radius: var(--radius-md); }
.step {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px;
  background: none; border: 1px solid transparent; border-radius: var(--radius-sm);
  color: var(--text-secondary); font-size: 13px; cursor: pointer;
  transition: background 160ms var(--ease-out), color 160ms var(--ease-out);
}
.step-n { font: 600 11px/1 var(--font-mono); padding: 3px 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.06); }
.step:hover:not(:disabled) { color: var(--text-primary); }
.step:disabled { color: var(--text-muted); opacity: 0.6; cursor: not-allowed; }
.step[aria-current="step"] { background: var(--surface-panel); border-color: var(--border-hairline);
  color: var(--text-primary); box-shadow: var(--inner-highlight); }
.step[aria-current="step"] .step-n { background: var(--accent); color: #fff; }
.step.done .step-n { background: var(--ok-bg); color: var(--ok-fg); }
.seal { display: flex; align-items: center; gap: 8px; padding: 5px 10px; font: 500 11px/1.3 var(--font-mono);
  color: var(--text-secondary); background: var(--surface-well); border: 1px solid var(--border-hairline);
  border-radius: var(--radius-full); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); flex: none; }
.dot.ok { background: var(--ok-fg); }
.dot.note { background: var(--note-fg); }
.dot.alert { background: var(--alert-fg); }

/* ---- estructura ---- */
main { max-width: 1360px; margin: 0 auto; padding: 24px 24px 72px; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 10px 14px; margin-bottom: 20px;
  border: 1px solid var(--note-border); background: var(--note-bg); border-radius: var(--radius-md); font-size: 13px; }
.banner.alert { border-color: var(--alert-border); background: var(--alert-bg); align-items: flex-end; }
.banner .dot { margin-top: 7px; }
.banner .field { flex: 1; }
.banner strong { font-weight: 600; }
.view { animation: enter 220ms var(--ease-out); }
@keyframes enter { from { opacity: 0.4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 20px; }
.head h1, .head h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; text-wrap: balance; }
.head p { color: var(--text-secondary); max-width: 68ch; margin-top: 6px; text-wrap: pretty; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }
h3 { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
.cols { display: grid; gap: 20px; align-items: start; }
.cols.intake { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.cols.mirror { grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); }
.cols.decision { grid-template-columns: 400px minmax(0, 1fr); }
.cols.twin { grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr); }
.stack { display: grid; gap: 20px; }
.panel { background: var(--surface-panel); border: 1px solid var(--border-hairline); border-radius: var(--radius-lg);
  box-shadow: var(--inner-highlight); min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px;
  border-bottom: 1px solid var(--border-hairline); }
.panel-body { padding: 18px; }
.well { background: var(--surface-well); border: 1px solid var(--border-hairline); border-radius: var(--radius-md); }

/* ---- controles ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 14px;
  background: var(--surface-panel); border: 1px solid var(--border-highlight); border-radius: var(--radius-md);
  box-shadow: var(--inner-highlight); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background 140ms var(--ease-out), border-color 140ms var(--ease-out), transform 80ms var(--ease-out);
}
.btn:hover:not(:disabled) { background: var(--surface-raised); border-color: rgba(255, 255, 255, 0.26); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { color: var(--text-muted); border-color: var(--border-hairline); cursor: not-allowed; box-shadow: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.primary:disabled { background: var(--surface-raised); border-color: var(--border-hairline); color: var(--text-muted); }
.btn.danger { background: var(--alert-bg); border-color: var(--alert-border); color: var(--alert-fg); }
.btn.danger:hover:not(:disabled) { background: rgba(239, 68, 68, 0.16); border-color: var(--alert-fg); }
.btn.quiet { background: none; border-color: transparent; box-shadow: none; color: var(--text-secondary); }
.btn.quiet:hover:not(:disabled) { background: var(--surface-raised); color: var(--text-primary); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn[aria-busy="true"] { cursor: progress; }
.btn[aria-busy="true"]::before { content: ""; width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid currentColor; border-right-color: transparent; animation: spin 700ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; font: 500 11px/1.5 var(--font-mono);
  color: var(--text-secondary); background: var(--surface-well); border: 1px solid var(--border-hairline);
  border-radius: var(--radius-full); white-space: nowrap; }
.chip.ok { color: var(--ok-fg); background: var(--ok-bg); border-color: var(--ok-border); }
.chip.note { color: var(--note-fg); background: var(--note-bg); border-color: var(--note-border); }
.chip.alert { color: var(--alert-fg); background: var(--alert-bg); border-color: var(--alert-border); }
.chip.accent { color: var(--accent-fg); background: var(--accent-bg); border-color: var(--accent-border); }
.field { display: grid; gap: 6px; }
.field label, .field .label { font-size: 12px; color: var(--text-secondary); }
.input.readonly { border-style: dashed; border-color: var(--border-hairline); color: var(--text-secondary); }
.head h2:focus { outline: none; }
.head h2:focus-visible { outline: 2px solid var(--accent-fg); outline-offset: 4px; }
.field small { color: var(--text-muted); font-size: 12px; }
.input { width: 100%; padding: 7px 10px; background: var(--surface-well); border: 1px solid var(--border-highlight);
  border-radius: var(--radius-sm); }
.input.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.input:hover:not(:disabled) { border-color: rgba(255, 255, 255, 0.26); }
.input:disabled { color: var(--text-muted); border-color: var(--border-hairline); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
.note-line { display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: var(--text-secondary); }
.msg { padding: 10px 12px; border-radius: var(--radius-md); font-size: 13px; border: 1px solid var(--border-hairline);
  background: var(--surface-well); color: var(--text-secondary); overflow-wrap: anywhere; }
.msg.alert { border-color: var(--alert-border); background: var(--alert-bg); color: var(--text-primary); }
.msg.note { border-color: var(--note-border); background: var(--note-bg); color: var(--text-primary); }
.msg.ok { border-color: var(--ok-border); background: var(--ok-bg); color: var(--text-primary); }
code { font: 12px/1.5 var(--font-mono); padding: 1px 5px; background: rgba(255, 255, 255, 0.06); border-radius: 3px;
  overflow-wrap: anywhere; }

/* ---- tablas ---- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { padding: 9px 14px; text-align: left; font: 600 11px/1.3 var(--font-mono); letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-muted); background: var(--surface-well);
  border-bottom: 1px solid var(--border-hairline); white-space: nowrap; }
th.num { text-align: right; }
td { padding: 9px 14px; border-bottom: 1px solid var(--border-hairline); color: var(--text-secondary); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.strong { color: var(--text-primary); font-weight: 500; }
tbody tr:hover td { background: rgba(255, 255, 255, 0.02); }

/* ---- paso 1: ingesta ---- */
.drop { display: grid; place-items: center; align-content: center; gap: 10px; min-height: 260px; padding: 32px 24px; text-align: center;
  border: 1px dashed var(--border-highlight); border-radius: var(--radius-md); background: var(--surface-well);
  cursor: pointer; transition: border-color 160ms var(--ease-out), background 160ms var(--ease-out); }
.drop:hover, .drop.over { border-color: var(--accent-fg); background: var(--accent-bg); }
.drop.off { cursor: not-allowed; border-style: solid; border-color: var(--border-hairline); }
.drop.off:hover { background: var(--surface-well); }
.drop-title { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
.facts { display: grid; gap: 8px; margin-top: 16px; list-style: none; font-size: 13px; color: var(--text-secondary); }
.facts li { display: grid; grid-template-columns: 14px 1fr; gap: 8px; align-items: baseline; }
.facts li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted);
  transform: translateY(-2px); }
.samples { list-style: none; }
.sample { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center; width: 100%;
  padding: 14px 18px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--border-hairline);
  cursor: pointer; transition: background 140ms var(--ease-out); }
.samples li:last-child .sample { border-bottom: 0; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
.sample:hover:not(:disabled) { background: var(--surface-raised); }
.sample:disabled { cursor: progress; }
.sample-title { font-weight: 600; }
.sample-desc { grid-column: 1; color: var(--text-secondary); font-size: 13px; }
.sample-go { grid-row: 1 / span 2; grid-column: 2; color: var(--accent-fg); font-size: 13px; }

/* ---- paso 2: espejo ---- */
.flow { display: flex; height: 28px; border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-hairline); }
.flow-seg { min-width: 3px; background: var(--note-fg); opacity: 0.75; border-right: 1px solid var(--surface-base); }
.flow-seg.ok { background: var(--ok-fg); }
.flow-seg:last-child { border-right: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 13px; color: var(--text-secondary); }
.legend span { display: inline-flex; align-items: baseline; gap: 7px; }
.cells { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }

/* ---- paso 3: bandeja y decision ---- */
.tray { position: sticky; top: 76px; }
.filters { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--border-hairline); }
.filter { padding: 3px 9px; font: 500 11px/1.5 var(--font-mono); color: var(--text-secondary); background: none;
  border: 1px solid transparent; border-radius: var(--radius-sm); cursor: pointer; }
.filter:hover { color: var(--text-primary); }
.filter[aria-pressed="true"] { color: var(--text-primary); background: var(--surface-raised); border-color: var(--border-hairline); }
.tray-list { list-style: none; max-height: calc(100vh - 260px); min-height: 160px; overflow-y: auto; }
.item { display: grid; grid-template-columns: 26px 1fr auto; gap: 2px 10px; width: 100%; padding: 11px 14px;
  text-align: left; background: none; border: 0; border-bottom: 1px solid var(--border-hairline); cursor: pointer;
  transition: background 120ms var(--ease-out); }
.item:hover { background: var(--surface-raised); }
.item[aria-current="true"] { background: var(--accent-bg); box-shadow: inset 0 0 0 1px var(--accent-border); }
.item-rank { grid-row: 1 / span 2; font: 500 12px/1.6 var(--font-mono); color: var(--text-muted); }
.item-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-value { font: 600 13px/1.5 var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.item-meta { grid-column: 2 / span 2; display: flex; justify-content: space-between; gap: 8px; align-items: center;
  font-size: 12px; color: var(--text-muted); }
.empty { padding: 28px 18px; text-align: center; color: var(--text-secondary); font-size: 13px; }
.line-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 16px 18px;
  border-bottom: 1px solid var(--border-hairline); }
.line-value { text-align: right; }
.line-value .num { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
.diff { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.diff .well { padding: 14px 16px; }
.diff .well.next { border-color: var(--accent-border); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 7px 16px; margin-top: 10px; font-size: 13px; }
.kv dt { color: var(--text-secondary); }
.kv dd { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.kv dd.hot { color: var(--accent-fg); font-weight: 600; }
.rule { padding: 14px 16px; }
.rule ol { list-style: none; display: grid; gap: 5px; margin: 10px 0; font: 13px/1.5 var(--font-mono);
  color: var(--text-secondary); counter-reset: paso; }
.rule li { display: grid; grid-template-columns: 20px 1fr; counter-increment: paso; }
.rule li::before { content: counter(paso); color: var(--text-muted); }
.rule .conclusion { font-weight: 600; color: var(--text-primary); }
.adjust { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 12px; align-items: end; }
.adjust-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.planbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: center; padding: 16px 18px; }
.planbar-sum { display: flex; flex-wrap: wrap; gap: 6px 24px; align-items: baseline; }
.planbar-sum b { font: 600 15px/1.4 var(--font-mono); font-variant-numeric: tabular-nums; }
.planbar-act { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; justify-content: flex-end; }
.planbar-act .field { width: 190px; }
details > summary { cursor: pointer; padding: 12px 18px; color: var(--text-secondary); font-size: 13px; list-style: none;
  border-top: 1px solid var(--border-hairline); }
details > summary::before { content: "+"; display: inline-block; width: 16px; font-family: var(--font-mono); }
details[open] > summary::before { content: "-"; }
details > summary:hover { color: var(--text-primary); }
.undo { display: grid; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--ok-border); background: var(--ok-bg); }
.undo-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.undo-track { height: 3px; background: rgba(255, 255, 255, 0.08); border-radius: 2px; overflow: hidden; }
.undo-fill { height: 100%; background: var(--ok-fg); transform-origin: left; animation: drain 15s linear forwards; }
@keyframes drain { to { transform: scaleX(0); } }
.sig { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 24px; padding: 14px 18px; }
.sig dt { margin-bottom: 2px; }
.sig dd { font: 13px/1.5 var(--font-mono); overflow-wrap: anywhere; }

/* ---- paso 4: gemelo ---- */
.sheets td:first-child { font-family: var(--font-mono); color: var(--text-primary); white-space: nowrap; }
.downloads { display: grid; gap: 10px; }
.downloads .btn { justify-content: flex-start; }

.toast { position: fixed; right: 24px; bottom: 24px; z-index: var(--z-toast); max-width: 420px; padding: 10px 14px;
  background: var(--surface-raised); border: 1px solid var(--border-highlight); border-radius: var(--radius-md);
  font-size: 13px; animation: enter 200ms var(--ease-out); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

@media (max-width: 1100px) {
  .cols.intake, .cols.mirror, .cols.decision, .cols.twin { grid-template-columns: minmax(0, 1fr); }
  .tray { position: static; }
  .tray-list { max-height: 320px; }
}
@media (max-width: 640px) {
  main { padding: 16px 16px 56px; }
  .top { position: static; }
  .top-inner { padding: 10px 16px; }
  .step-label { display: none; }
  .head h1, .head h2 { font-size: 20px; }
  .diff, .adjust, .planbar { grid-template-columns: minmax(0, 1fr); }
  .planbar-act { justify-content: stretch; }
  .planbar-act .field, .planbar-act .btn { width: 100%; }
  .toast { left: 16px; right: 16px; bottom: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  .undo-fill { animation: none; }
  .btn[aria-busy="true"]::before { animation: none; border-right-color: currentColor; opacity: 0.5; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1 class="brand"><span class="brand-mark">NARVI</span><span class="brand-sub">Decision Cockpit · Nivel 1</span></h1>
    <nav aria-label="Pasos del flujo"><ol class="steps" id="steps"></ol></nav>
    <div class="seal" id="seal" role="status"><span class="dot"></span><span>Conectando</span></div>
  </div>
</header>
<main>
  <div id="banner"></div>
  <div id="view"><p class="soft">Cargando el cockpit.</p></div>
  <noscript><p class="msg alert">Esta consola necesita JavaScript para leer la planilla y mostrar el plan.</p></noscript>

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") el.className = value;
    else if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
    else el.setAttribute(key, value === true ? "" : value);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));

const numberFormat = new Intl.NumberFormat("es-CL", { maximumFractionDigits: 2, useGrouping: "always" });
const isBlank = (value) => value === null || value === undefined || value === "";
const num = (value) => (isBlank(value) ? "s/d" : numberFormat.format(value));
const money = (value) => (isBlank(value) ? "sin costo" : "$ " + numberFormat.format(value));
const cellText = (value) => (isBlank(value) ? "vacía" : typeof value === "number" ? numberFormat.format(value) : String(value));
const shortHash = (value) => (value ? value.slice(0, 12) + "…" + value.slice(-6) : "s/d");
const when = (iso) => (iso ? new Date(iso).toLocaleString("es-CL", { dateStyle: "medium", timeStyle: "short" }) : "s/d");

class ApiError extends Error {
  constructor(status, detail) {
    super(detail);
    this.status = status;
  }
}

function readSnapshot() {
  try {
    return JSON.parse($("#narvi-snapshot").textContent);
  } catch (error) {
    return null;
  }
}

const snapshot = readSnapshot();
const UNDO_HIGHLIGHT_MS = 15000;
const BOOT_TIMEOUT_MS = 4000;
const LOCAL_HOSTS = ["localhost", "127.0.0.1", "[::1]"];

const state = {
  mode: "server", // "server" | "snapshot"
  apiKey: "",
  needsKey: false,
  samples: [],
  signing: null,
  limits: null,
  sampleId: null,
  step: 1,
  busy: "",
  error: "",
  intake: null,
  params: null,
  plan: null,
  overrides: {},
  selected: null,
  filter: "todas",
  showAllRows: false,
  decision: null,
  undoHot: false,
  undone: false,
  signer: "",
  twinHash: "",
  pendingSample: null,
  draft: { sku: null, qty: "", reason: "" }, // lo que la persona esta escribiendo en el ajuste de una linea
};
let undoTimer = null;

function describeDetail(detail, status) {
  if (typeof detail === "string") return detail;
  if (Array.isArray(detail)) return detail.map((item) => item.msg || JSON.stringify(item)).join("; ");
  return "El servidor respondió " + status + ".";
}

async function server(path, { method = "GET", json, form } = {}) {
  const headers = {};
  if (state.apiKey) headers["X-API-Key"] = state.apiKey;
  if (json) headers["Content-Type"] = "application/json";
  let response;
  try {
    response = await fetch("/api/cockpit" + path, { method, headers, body: json ? JSON.stringify(json) : form });
  } catch (error) {
    throw new ApiError(0, "No se pudo llegar al servidor del cockpit.");
  }
  if (!response.ok) {
    let detail = null;
    try {
      detail = (await response.json()).detail;
    } catch (error) {
      detail = null; // el cuerpo no era JSON: queda el codigo de estado
    }
    throw new ApiError(response.status, describeDetail(detail, response.status));
  }
  return response;
}

const DEFAULT_KEYS = ["cover_periods", "order_up_to_factor"];

/** Sin servidor: devuelve lo que respondio el motor cuando se congelo la corrida. */
function frozen(path, { json, form } = {}) {
  if (path === "/samples") return snapshot.samples;
  if (path === "/intake") {
    const id = form && form.get("sample");
    if (!id || !snapshot.runs[id]) throw new ApiError(0, "Sin servidor no se puede leer un archivo: elegí una muestra.");
    state.sampleId = id;
    return snapshot.runs[id].intake;
  }
  const run = snapshot.runs[state.sampleId];
  if (path === "/solve") {
    const defaults = run.intake.defaults;
    const changed = DEFAULT_KEYS.some((key) => json[key] !== defaults[key]) || Object.keys(json.overrides || {}).length > 0;
    if (changed) throw new ApiError(0, "Sin servidor no se recalcula: el plan que ves es el de la corrida congelada.");
    return run.solve;
  }
  if (path === "/approve-t2") {
    if (run.approve_error) throw new ApiError(run.approve_error.status, run.approve_error.detail);
    return run.approve;
  }
  if (path === "/rollback") return run.rollback;
  throw new ApiError(0, "Sin servidor no se genera el archivo.");
}

async function call(path, options) {
  if (state.mode === "snapshot") return frozen(path, options);
  return (await server(path, options)).json();
}

function say(text) {
  $("#live").textContent = text;
}

/** Corre una accion mostrando que esta en curso y dejando el error a la vista. */
async function run(name, action) {
  if (state.busy) return;
  // Mientras dura la accion los botones quedan deshabilitados y el foco se cae al
  // documento. Se recuerda donde estaba para devolverlo al terminar.
  const focusId = document.activeElement && document.activeElement.id;
  state.busy = name;
  state.error = "";
  render();
  try {
    await action();
  } catch (error) {
    state.error = error instanceof ApiError ? error.message : "Error inesperado en la página: " + error.message;
    if (error instanceof ApiError && error.status === 401) state.needsKey = true;
    if (error instanceof ApiError && error.status === 404 && state.intake) {
      state.error += " Volvé al paso 1.";
    }
    say(state.error);
  } finally {
    state.busy = "";
    render();
    const target = focusId && document.getElementById(focusId);
    if (target && !target.disabled && document.activeElement === document.body) target.focus({ preventScroll: true });
  }
}

function resetSession() {
  clearTimeout(undoTimer);
  Object.assign(state, {
    intake: null, params: null, plan: null, overrides: {}, selected: null, filter: "todas", showAllRows: false,
    decision: null, undoHot: false, undone: false, twinHash: "", sampleId: null, step: 1, error: "",
    draft: { sku: null, qty: "", reason: "" },
  });
}

function intake(form, label) {
  return run("intake", async () => {
    const data = await call("/intake", { method: "POST", form });
    resetSession();
    if (form.get("sample")) state.sampleId = form.get("sample");
    state.intake = data;
    state.params = { ...data.defaults };
    state.step = 2;
    say("Planilla leída: " + label + ".");
  });
}

function loadSample(sample) {
  const form = new FormData();
  form.set("sample", sample.id);
  state.pendingSample = sample.id;
  return intake(form, sample.title);
}

function loadFile(file) {
  if (!file) return null;
  if (state.mode === "snapshot") {
    state.error = "Sin servidor no se puede leer un archivo: elegí una muestra.";
    return render();
  }
  const form = new FormData();
  form.set("file", file);
  return intake(form, file.name);
}

function planBody() {
  return { session: state.intake.session, ...state.params, overrides: state.overrides };
}

async function refreshPlan() {
  state.plan = await call("/solve", { method: "POST", json: planBody() });
  const known = state.plan.lines.some((line) => line.sku === state.selected);
  if (!known) state.selected = state.plan.exceptions[0] || (state.plan.lines[0] && state.plan.lines[0].sku) || null;
}

function solve() {
  return run("solve", async () => {
    await refreshPlan();
    state.step = 3;
    say("Plan calculado: " + state.plan.totals.n_restock + " líneas bajo su objetivo.");
  });
}

/** Guarda, cambia o quita el ajuste de una linea y recalcula. Si falla, el ajuste no queda. */
function adjust(sku, override) {
  return run("adjust", async () => {
    const before = state.overrides;
    const next = { ...before };
    if (override) next[sku] = override;
    else delete next[sku];
    state.overrides = next;
    try {
      await refreshPlan();
    } catch (error) {
      state.overrides = before;
      throw error;
    }
    state.draft = { sku: null, qty: "", reason: "" };
    say(override ? "Ajuste guardado para " + sku + "." : "La línea " + sku + " volvió al número del motor.");
  });
}

function approve() {
  return run("approve", async () => {
    const changeset = state.plan.changeset;
    state.decision = await call("/approve-t2", {
      method: "POST",
      json: { session: state.intake.session, changeset_key: changeset.key, content_hash: changeset.content_hash,
              approved_by: state.signer.trim() || "operador" },
    });
    state.undone = false;
    state.undoHot = true;
    clearTimeout(undoTimer);
    undoTimer = setTimeout(() => {
      state.undoHot = false;
      render();
    }, UNDO_HIGHLIGHT_MS);
    say("Plan aplicado en la copia de trabajo. Podés deshacerlo.");
  });
}

function undo() {
  return run("undo", async () => {
    await call("/rollback", { method: "POST", json: { session: state.intake.session } });
    clearTimeout(undoTimer);
    state.decision = null;
    state.undoHot = false;
    state.undone = true;
    await refreshPlan();
    say("Plan deshecho: la copia de trabajo volvió a como estaba.");
  });
}

/** El nombre que manda el servidor. Con acentos llega como filename*=utf-8''... (RFC 5987). */
function downloadName(disposition) {
  const encoded = /filename\*=utf-8''([^;]+)/i.exec(disposition);
  if (encoded) {
    try {
      return decodeURIComponent(encoded[1]);
    } catch (error) {
      return "narvi.xlsx"; // secuencia mal codificada: un nombre fijo antes que uno roto
    }
  }
  const plain = /filename="([^"]+)"/.exec(disposition);
  return plain ? plain[1] : "narvi.xlsx";
}

function download(variant) {
  return run("download-" + variant, async () => {
    if (state.mode === "snapshot") throw new ApiError(0, "Sin servidor no se genera el archivo.");
    const query = new URLSearchParams({ session: state.intake.session, variant });
    const response = await server("/export-twin?" + query.toString());
    const name = downloadName(response.headers.get("content-disposition") || "");
    const link = h("a", { href: URL.createObjectURL(await response.blob()), download: name });
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    if (variant === "gemelo") state.twinHash = response.headers.get("x-narvi-sha256") || "";
    say("Archivo descargado.");
  });
}

function goTo(step) {
  if (step > maxStep()) return;
  state.step = step;
  state.error = "";
  render();
  window.scrollTo({ top: 0 });
}

function maxStep() {
  if (!state.intake) return 1;
  return state.plan ? 4 : 2;
}

function enterSnapshot() {
  state.mode = "snapshot";
  state.samples = snapshot.samples.samples;
  state.signing = snapshot.samples.signing;
  state.limits = snapshot.samples.limits;
}

async function connect() {
  const timeout = new Promise((_, reject) => setTimeout(() => reject(new ApiError(0, "sin respuesta")), BOOT_TIMEOUT_MS));
  const data = await Promise.race([server("/samples").then((response) => response.json()), timeout]);
  state.mode = "server";
  state.needsKey = false;
  state.samples = data.samples;
  state.signing = data.signing;
  state.limits = data.limits;
}

async function boot() {
  if (location.protocol === "file:" && snapshot) {
    enterSnapshot();
    return render();
  }
  try {
    await connect();
  } catch (error) {
    const status = error instanceof ApiError ? error.status : 0;
    // Solo se cae a la corrida congelada si no hay cockpit del otro lado (sin
    // respuesta, o un servidor que no tiene estas direcciones). Un servidor que
    // contesta con otro error tiene un problema, y taparlo con datos viejos lo esconderia.
    if (status === 401) state.needsKey = true;
    else if (snapshot && (status === 0 || status === 404)) enterSnapshot();
    else state.error = status ? error.message : "No hay servidor del cockpit y este archivo no trae una corrida congelada.";
  }
  return render();
}

function useKey(key) {
  state.apiKey = key.trim();
  return run("key", connect);
}

      thresholdField()),
    state.mode === "snapshot" ? h("p", { class: "muted" }, "Sin servidor los parámetros quedan fijos.") : null,
    actionButton("solve", "Calcular con estos parámetros", { id: "solve", onclick: solve })));
}

function previewPanel(mirror, preview) {
  const byDemand = mirror.mode === "demand-cover";
  const any = (key) => preview.some((row) => !isBlank(row[key]));
  const columns = [["Fila", true], ["Código"], ["Descripción"], ["Stock", true],
    [byDemand ? "Demanda" : "Punto de reorden", true]];
  if (any("on_order")) columns.push(["En tránsito", true]);
  if (any("cost")) columns.push(["Costo", true]);
  const rows = (state.showAllRows ? preview : preview.slice(0, PREVIEW_ROWS)).map((row) => {
    const cells = [row.row, h("span", { class: "mono strong" }, row.sku), row.name || "",
      num(row.on_hand), num(byDemand ? row.demand_per_period : row.reorder_point)];
    if (any("on_order")) cells.push(num(row.on_order));
    if (any("cost")) cells.push(num(row.cost));
    return cells;
  });
  const toggle = preview.length > PREVIEW_ROWS ? h("button", { type: "button", class: "btn quiet sm", id: "rows-toggle",
    onclick: () => { state.showAllRows = !state.showAllRows; render(); } },
    state.showAllRows ? "Ver menos" : "Ver las " + preview.length + " filas") : null;
  return panel("Lo que Kern leyó", toggle, table(columns, rows));
}

function viewMirror() {
  const { mirror, preview, filename } = state.intake;
  const byDemand = mirror.mode === "demand-cover";
  const columns = table([["Campo"], ["Col."], ["Encabezado en tu planilla"]], mirror.columns.map((column) => [
    h("span", { class: "strong" }, ROLE_LABELS[column.role] || column.role),
    h("span", { class: "mono" }, column.letter), column.header]));
  return h("div", {},
    head("Espejo de calidad",
      filename + ": hoja «" + mirror.sheet + "», encabezado en la fila " + mirror.header_row + ". Kern leyó "
      + mirror.plannable_rows + " códigos de " + mirror.data_rows + " filas con datos.",
      h("button", { type: "button", class: "btn quiet", id: "change-file", onclick: () => goTo(1) }, "Cambiar planilla"),
      actionButton("solve", "Calcular plan", { class: "primary", id: "solve-top", onclick: solve })),
    errorBox(),
    h("div", { class: "stack" },
      panel("Adónde fue cada fila", h("span", { class: "muted mono" }, mirror.data_rows + " filas con datos"), rowFlow(mirror)),
      h("div", { class: "cols mirror" },
        panel("Controles", null, checksTable(mirror)),
        h("div", { class: "stack" },
          panel("Columnas reconocidas", chip("", byDemand ? "cobertura de demanda" : "punto de reorden"), columns),
          paramsPanel(mirror))),
      previewPanel(mirror, preview)));
}

// ---- paso 3: bandeja y aprobacion ---------------------------------------------------

function trayEntries(plan) {
  const bySku = new Map(plan.lines.map((line) => [line.sku, line]));
  const ranked = plan.exceptions.map((sku, i) => ({ ...bySku.get(sku), rank: i + 1 }));
  const unplanned = plan.unplanned.map((row) => ({ ...row, status: "sin_senal" }));
  const inBand = plan.lines.filter((line) => line.status === "en_banda");
  if (state.filter === "todas") return [...ranked, ...unplanned];
  if (state.filter === "sin_senal") return unplanned;
  if (state.filter === "en_banda") return inBand;
  return ranked.filter((line) => line.status === state.filter);
}

function select(sku, focusId) {
  state.selected = sku;
  state.error = "";
  render();
  const target = focusId && document.getElementById(focusId);
  if (target) target.focus();
}

function trayItem(entry, index, entries) {
  const [kind, label] = STATUS[entry.status];
  const value = entry.status === "sin_senal" ? "" : isBlank(entry.unit_cost) ? num(entry.restock_qty) + " u." : money(entry.order_value);
  const move = (event) => {
    const step = event.key === "ArrowDown" ? 1 : event.key === "ArrowUp" ? -1 : 0;
    const next = entries[index + step];
    if (!step || !next) return;
    event.preventDefault();
    select(next.sku, "item-" + (index + step));
  };
  return h("li", {}, h("button", { type: "button", class: "item", id: "item-" + index,
    "aria-current": entry.sku === state.selected ? "true" : null, onclick: () => select(entry.sku, "item-" + index), onkeydown: move },
    h("span", { class: "item-rank" }, entry.rank || "·"),
    h("span", { class: "item-name" }, entry.name || entry.sku),
    h("span", { class: "item-value" }, value),
    h("span", { class: "item-meta" }, h("span", { class: "mono" }, entry.sku), chip(kind, label))));
}

function tray(plan) {
  const entries = trayEntries(plan);
  const filters = FILTERS.map(([key, label]) => h("button", { type: "button", class: "filter", id: "filter-" + key,
    "aria-pressed": String(state.filter === key), onclick: () => { state.filter = key; render(); } }, label));
  const basis = plan.ranking.basis === "valor" ? "por valor del pedido" : "por unidades: la planilla no trae costo";
  const shown = entries.slice(0, LIST_LIMIT);
  return h("section", { class: "panel tray", "aria-label": "Excepciones" },
    h("div", { class: "panel-head" }, h("h3", {}, "Excepciones"), h("span", { class: "muted mono" }, basis)),
    h("div", { class: "filters" }, filters),
    entries.length ? h("ul", { class: "tray-list" }, shown.map(trayItem))
      : h("p", { class: "empty" }, state.filter === "todas"
        ? "Ninguna línea quedó bajo su objetivo: no hay nada que pedir." : "Ninguna línea con este filtro."),
    entries.length > shown.length ? h("p", { class: "empty" }, "Se muestran las " + shown.length + " de mayor valor, de "
      + num(entries.length) + ". El plan y el libro gemelo las llevan todas.") : null);
}

function pair(label, value, hot) {
  return [h("dt", {}, label), h("dd", { class: hot ? "hot" : null }, value)];
}

function diff(plan, line) {
  const byDemand = plan.mode === "demand-cover";
  const write = plan.changeset && plan.changeset.writes.find((item) => item.cell === line.cell);
  return h("div", { class: "diff" },
    h("div", { class: "well" }, micro("Planilla hoy"), h("dl", { class: "kv" },
      pair("Celda de pedido " + line.cell, cellText(write ? write.before : null)),
      pair("Stock", num(line.on_hand)),
      pair("En tránsito", isBlank(line.on_order) ? "no informado" : num(line.on_order)),
      pair("Posición", num(line.position)),
      pair(byDemand ? "Demanda por período" : "Punto de reorden", num(byDemand ? line.target / plan.params.cover_periods : line.trigger)))),
    h("div", { class: "well next" }, micro("Propuesta"), h("dl", { class: "kv" },
      pair("Celda de pedido " + line.cell, line.restock_qty > 0 ? num(line.restock_qty) : "sin cambio", true),
      pair("Objetivo", num(line.target)),
      pair("Costo unitario", money(line.unit_cost)),
      pair("Valor del pedido", money(line.order_value)),
      pair("Origen", line.overridden ? "ajuste humano (motor: " + num(line.engine_qty) + ")" : "motor"))));
}

function rule(line) {
  const evidence = line.evidence;
  return h("div", { class: "well rule" }, micro("Regla aplicada"),
    h("p", { class: "soft" }, evidence.formula),
    h("ol", {}, evidence.steps.split(" · ").map((step) => h("li", {}, h("span", {}, step)))),
    h("p", { class: "conclusion" }, evidence.conclusion),
    line.overridden ? h("p", { class: "soft" }, "Motivo del ajuste: " + (line.reason || "sin motivo registrado")) : null);
}

function adjustForm(line) {
  if (state.decision) return null;
  if (state.mode === "snapshot") return h("p", { class: "muted" }, "Sin servidor no se pueden ajustar cantidades.");
  if (state.draft.sku !== line.sku) state.draft = { sku: line.sku, qty: String(line.restock_qty), reason: line.reason || "" };
  const draft = state.draft;
  const save = () => {
    const qty = Number(draft.qty.replace(",", "."));
    if (draft.qty.trim() === "" || !Number.isFinite(qty) || qty < 0) {
      state.error = "La cantidad tiene que ser un número mayor o igual a 0.";
      return render();
    }
    return adjust(line.sku, { qty, reason: draft.reason.trim() });
  };
  return h("form", { onsubmit: (event) => { event.preventDefault(); save(); } },
    h("div", { class: "adjust" },
      h("div", { class: "field" }, h("label", { for: "adjust-qty" }, "Cantidad a pedir"),
        h("input", { class: "input num", id: "adjust-qty", inputmode: "decimal", autocomplete: "off", value: draft.qty,
          oninput: (event) => { draft.qty = event.target.value; } })),
      h("div", { class: "field" }, h("label", { for: "adjust-reason" }, "Motivo del ajuste"),
        h("input", { class: "input", id: "adjust-reason", maxlength: "300", autocomplete: "off", value: draft.reason,
          oninput: (event) => { draft.reason = event.target.value; } })),
      actionButton("adjust", "Guardar ajuste", { type: "submit", id: "adjust-save" })),
    h("div", { class: "adjust-actions" },
      actionButton("adjust", "Excluir línea", { class: "danger sm", id: "adjust-exclude",
        onclick: () => adjust(line.sku, { qty: 0, reason: draft.reason.trim() }) }),
      line.overridden ? actionButton("adjust", "Volver al número del motor", { class: "quiet sm", id: "adjust-restore",
        onclick: () => adjust(line.sku, null) }) : null));
}

function lineDetail(plan) {
  const line = plan.lines.find((item) => item.sku === state.selected);
  if (!line) {
    const row = plan.unplanned.find((item) => item.sku === state.selected);
    if (!row) return panel("Sin selección", null, h("p", { class: "empty" }, "Elegí una línea de la bandeja."));
    return h("section", { class: "panel" },
      h("div", { class: "line-head" }, h("div", {}, h("h3", {}, row.name || row.sku),
        h("div", { class: "note-line" }, h("span", { class: "mono" }, row.sku), "fila " + row.row, chip("note", "sin señal")))),
      h("div", { class: "panel-body" }, message("note", "Kern no planifica esta fila: " + row.why
        + ". Completá la celda en tu planilla y volvé a cargarla.")));
  }
  const [kind, label] = STATUS[line.status];
  return h("section", { class: "panel" },
    h("div", { class: "line-head" },
      h("div", {}, h("h3", {}, line.name || line.sku), h("div", { class: "note-line" },
        h("span", { class: "mono" }, line.sku), "fila " + line.row, chip(kind, label),
        line.overridden ? chip("note", "ajuste humano") : null)),
      h("div", { class: "line-value" }, micro("Valor del pedido"),
        h("div", { class: "num" }, isBlank(line.unit_cost) ? num(line.restock_qty) + " u." : money(line.order_value)))),
    h("div", { class: "panel-body stack" }, diff(plan, line), rule(line), adjustForm(line)));
}

function changesTable(changeset) {
  const rows = [
    ...changeset.writes.map((item) => [h("span", { class: "mono strong" }, item.cell), cellText(item.before), cellText(item.after), chip("accent", "escribe")]),
    ...changeset.guards.map((item) => [h("span", { class: "mono strong" }, item.cell), cellText(item.value), cellText(item.value), chip("", "guarda")]),
  ];
  return h("details", { id: "changes" },
    h("summary", {}, "Ver el cambio celda por celda: " + num(changeset.writes.length) + " escrituras y "
      + num(changeset.guards.length) + " celdas guarda (si alguna cambia antes de aplicar, se rechaza)"),
    table([["Celda"], ["Antes", true], ["Después", true], ["Tipo"]], rows.slice(0, LIST_LIMIT)),
    rows.length > LIST_LIMIT ? h("p", { class: "empty" }, "Se muestran las primeras " + LIST_LIMIT + " de "
      + num(rows.length) + " celdas. La hoja Narvi_Propuesta del libro gemelo las trae todas.") : null);
}

function signature(decision) {
  const item = (label, value) => h("div", {}, h("dt", { class: "micro" }, label), h("dd", {}, value));
  return h("dl", { class: "sig" },
    item("Clave del cambio", decision.key),
    item("Huella SHA-256", shortHash(decision.content_hash)),
    item("Firma HMAC", decision.signed ? decision.signature + "… (primeros 16)" : "sin sello válido: modo de prueba"),
    item("Aprobó", decision.approved_by),
    item("La firma vence", when(decision.expires_at)));
}

function undoBlock(decision) {
  return h("div", {},
    h("div", { class: "undo" },
      h("div", { class: "undo-row" },
        h("div", {}, h("strong", {}, "Plan aplicado en la copia de trabajo. "),
          decision.writes + " celdas escritas, con respaldo. Deshacer sigue disponible mientras dure la sesión."),
        actionButton("undo", "Deshacer plan aplicado", { class: "danger", id: "undo", onclick: undo })),
      state.undoHot ? h("div", { class: "undo-track", "aria-hidden": "true" }, h("div", { class: "undo-fill" })) : null),
    state.mode === "snapshot" ? h("div", { class: "panel-body" }, message("note",
      "Repetición de una corrida real del " + when(snapshot.meta.generated_at) + ": en este modo nada se escribe.")) : null,
    signature(decision));
}

function signingNote() {
  const signing = state.signing;
  if (state.decision || state.mode === "snapshot" || !signing) return null;
  if (signing.configured) return null;
  if (signing.unsigned_allowed) return message("note", "Modo de prueba: el servidor no tiene clave de firma, así que la aprobación no lleva un sello válido.");
  return message("alert", "El servidor no tiene clave de firma y va a rechazar la aprobación. Arrancá el cockpit con ",
    h("code", {}, "python scripts/run_cockpit.py"), " o definí ", h("code", {}, "LINCHPIN_APPROVAL_SECRET"), ".");
}

function planPanel(plan) {
  const totals = plan.totals;
  const escalation = plan.escalation;
  const threshold = isBlank(totals.value) ? chip("", "sin costo: valor desconocido")
    : escalation.escalated ? chip("alert", "sobre el umbral de " + money(escalation.threshold))
      : chip("ok", "bajo el umbral de " + money(escalation.threshold));
  const signer = h("div", { class: "field" }, h("label", { for: "signer" }, "Quién aprueba"),
    h("input", { class: "input", id: "signer", maxlength: "80", autocomplete: "off", value: state.signer,
      disabled: Boolean(state.decision), oninput: (event) => { state.signer = event.target.value; } }));
  return h("section", { class: "panel", "aria-label": "Plan" },
    h("div", { class: "planbar" },
      h("div", { class: "planbar-sum" },
        h("span", {}, h("b", {}, num(totals.n_restock)), " líneas a pedir"),
        h("span", {}, h("b", {}, num(totals.units)), " unidades"),
        h("span", {}, h("b", {}, money(totals.value))), threshold),
      h("div", { class: "planbar-act" }, signer,
        actionButton("approve", "Aprobar plan (T2)", { class: "primary", id: "approve",
          disabled: !plan.approvable || Boolean(state.decision), onclick: approve }))),
    plan.blocked_reason || state.undone || signingNote() ? h("div", { class: "panel-body stack" },
      plan.blocked_reason ? message("note", plan.blocked_reason) : null,
      state.undone ? message("ok", "Plan deshecho: la copia de trabajo volvió a como estaba.") : null,
      signingNote()) : null,
    state.decision ? undoBlock(state.decision) : null,
    plan.changeset ? changesTable(plan.changeset) : null);
}

function viewDecision() {
  const plan = state.plan;
  const totals = plan.totals;
  const left = [totals.n_unplanned && totals.n_unplanned + " sin señal", totals.n_skipped_rows && totals.n_skipped_rows + " con stock no numérico",
    totals.n_total_rows && totals.n_total_rows + " fila TOTAL descartada"].filter(Boolean);
  return h("div", {},
    head("Bandeja de decisiones",
      totals.n_restock + " de " + totals.n_lines + " líneas planificadas quedaron bajo su objetivo. Los valores van en la moneda de la planilla."
      + (left.length ? " Fuera del plan: " + left.join(", ") + "." : ""),
      h("button", { type: "button", class: "btn quiet", id: "back-mirror", onclick: () => goTo(2) }, "Volver al espejo"),
      h("button", { type: "button", class: "btn", id: "to-twin", onclick: () => goTo(4) }, "Ver libro gemelo")),
    errorBox(),
    h("div", { class: "cols decision" }, tray(plan), h("div", { class: "stack" }, lineDetail(plan), planPanel(plan))));
}

// ---- paso 4: libro gemelo -----------------------------------------------------------

function viewTwin() {
  const name = state.intake.filename.replace(/\.[^.]+$/, "");
  const decision = state.decision;
  const status = decision ? "aprobado por " + decision.approved_by : state.undone ? "deshecho" : "propuesto";
  const item = (label, value) => h("div", {}, h("dt", { class: "micro" }, label), h("dd", {}, value));
  return h("div", {},
    head("Libro gemelo", "Un archivo aparte, " + name + ".narvi.xlsx: tu planilla como estaba, más cuatro hojas. Sin macros.",
      h("button", { type: "button", class: "btn quiet", id: "back-decision", onclick: () => goTo(3) }, "Volver a la bandeja")),
    errorBox(),
    h("div", { class: "cols twin" },
      h("div", { class: "stack" },
        panel("Qué trae", null, table([["Hoja"], ["Contenido"]], TWIN_SHEETS, "sheets")),
        message("", "Los parámetros viven en Narvi_Mapa (celdas B4 y B5). Si los cambiás en Excel, la columna recalculo_excel "
          + "se mueve y la columna coincide marca REVISAR donde ya no da el número de Kern.")),
      h("div", { class: "stack" },
        panel("Descargas", null, h("div", { class: "panel-body downloads" },
          actionButton("download-gemelo", "Descargar libro gemelo", { class: "primary", id: "download-twin",
            disabled: state.mode === "snapshot", onclick: () => download("gemelo") }),
          actionButton("download-aplicada", "Descargar planilla con el pedido aplicado", { id: "download-applied",
            disabled: state.mode === "snapshot" || !decision, onclick: () => download("aplicada") }),
          state.mode === "snapshot" ? h("p", { class: "muted" }, "Sin servidor no se genera el archivo.")
            : !decision ? h("p", { class: "muted" }, "La planilla aplicada existe después de aprobar el plan.") : null)),
        panel("Estado", null, h("dl", { class: "sig" },
          item("Plan", status),
          item("SHA-256 de tu planilla", shortHash(state.intake.mirror.sha256)),
          item("SHA-256 del gemelo", state.twinHash ? shortHash(state.twinHash) : "se informa al descargar"))),
        h("button", { type: "button", class: "btn", id: "restart", onclick: () => { resetSession(); render(); } }, "Cargar otra planilla"))));
}

// ---- armado -------------------------------------------------------------------------

function render() {
  const focused = document.activeElement && document.activeElement.id;
  renderSteps();
  renderSeal();
  renderBanner();
  const view = [viewIntake, viewMirror, viewDecision, viewTwin][state.step - 1]();
  const stepChanged = renderedStep !== state.step;
  const firstRender = renderedStep === 0;
  if (stepChanged) view.classList.add("view");
  renderedStep = state.step;
  $("#view").replaceChildren(view);
  // Al cambiar de paso el foco va al titulo de la pantalla nueva; si no, vuelve a donde estaba.
  const target = stepChanged && !firstRender ? $("#view-title") : focused && document.getElementById(focused);
  if (target && target !== document.activeElement) target.focus({ preventScroll: true });
}

boot();
</script>
</body>
</html>
